name: No verbatim spec text

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Reject verbatim paid ISO 32000-2 specification text (with its "Sold by
  # the PDF Association ... Single user only" purchase watermark) from ever
  # being re-pasted into source. Fable-448 F-001 remediation guard.
  # Per-repo file justified per [CI-108]: the check ties to this repo's diff.
  no-verbatim-spec-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for the ISO purchase watermark
        run: |
          # Scoped to Sources/ only: the ban is on shipping the watermark in
          # product source. Tests/ legitimately embeds these literals in the
          # F-001 regression test that asserts the watermark stays gone.
          if grep -rn "Sold by the PDF Association" --include='*.swift' Sources 2>/dev/null; then
            echo "::error::Verbatim paid ISO 32000-2 spec text (purchase watermark) found in source — see Fable-448 F-001." >&2
            exit 1
          fi
          if grep -rn "© ISO 2020" --include='*.swift' Sources 2>/dev/null; then
            echo "::error::Verbatim ISO 32000-2 copyright line found in source — see Fable-448 F-001." >&2
            exit 1
          fi
